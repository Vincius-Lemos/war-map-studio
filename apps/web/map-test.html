<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Teste do mapa</title>
    <style>
      html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; background: #0b0f14; color: #e7edf4; }
      #app { display: grid; grid-template-rows: 44px 1fr 150px; height: 100vh; }
      #bar { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #080b10; border-bottom: 1px solid #263141; }
      #bar button { background: #18202b; color: #e7edf4; border: 1px solid #263141; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
      #map { position: relative; min-height: 0; }
      #ctl { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #080b10; border-top: 1px solid #263141; }
      #t { flex: 1; }
      #log { margin: 0; padding: 8px 12px; overflow: auto; font: 12px/1.4 Consolas, monospace; color: #8a97a8; background: #080b10; border-top: 1px solid #263141; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <strong>Teste do motor de mapa</strong>
        <button id="fit">Enquadrar</button>
        <button id="region">Trocar país / ruas</button>
        <button id="png">Exportar PNG 1920x1080</button>
      </div>
      <div id="map"></div>
      <div>
        <div id="ctl">
          <span id="tl" style="min-width:110px">t = 20.0 h</span>
          <input id="t" type="range" min="0" max="72" step="0.1" value="20" />
        </div>
        <pre id="log"></pre>
      </div>
    </div>
    <script type="module" src="/src/map/dev/main.ts"></script>
  </body>
</html>
